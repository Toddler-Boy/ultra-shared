# Owned by the ultra-shared submodule (Source/ultra-shared/Data); the copies in
# Data/CRTEmulation/Presets are configure-synced by CMake, edit only here.
# A preset may define any subset of the scope keys (noise through reflection);
# missing keys keep their current value.
crt:
  noise: 10
  sharpening: 30
  luma-blur: 50
  chroma-blur: 50
  crosstalk: 20
  hannover: 90
  rainbowing: 50
  drift: 20
  curve: 25
  bleed: 20
  bleed-red: -100, 0
  bleed-green: 75, -75
  bleed-blue: 75, 75
  convergence: 20
  h-wave: 50
  expansion: 50
  scanlines: 35
  mask: 25
  mask-bitmap: $DATA$/Slot Mask
  phosphor-decay: 40
  vignette: 50
  adjacent: 50
  halation: 50
  ambient: 50
  reflection: 50
